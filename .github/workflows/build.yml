name: Build Devin Plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goarch: amd64
            output: devin-desktop.so
          - os: windows
            arch: amd64
            runner: windows-latest
            goarch: amd64
            output: devin-desktop.dll

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout CLIProxyAPI
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: main
          path: _cliproxy

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Adjust replace directive
        shell: bash
        run: |
          # Point the replace directive at the checked-out CLIProxyAPI tree.
          go mod edit -replace github.com/router-for-me/CLIProxyAPI/v7=./_cliproxy
          go mod tidy

      - name: Build plugin (Linux)
        if: matrix.os == 'linux'
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -o devin-desktop.so .

      - name: Build plugin (Windows)
        if: matrix.os == 'windows'
        run: |
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o devin-desktop.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devin-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            devin-desktop.so
            devin-desktop.dll
            devin-desktop.h
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            devin-desktop.so
            devin-desktop.dll
            devin-desktop.h
          fail_on_unmatched_files: false
